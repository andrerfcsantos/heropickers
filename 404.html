<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Hero Pickers</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body class="flex min-h-screen flex-col">
    <main
      class="mx-auto flex max-w-2xl flex-1 flex-col items-center justify-center px-5 py-24 text-center"
    >
      <p class="text-sm tracking-[0.3em] text-muted uppercase">Error 404</p>

      <h1 class="mt-4 text-4xl font-extrabold tracking-tight sm:text-5xl">
        Nothing to <span class="wordmark">pick here</span>
      </h1>

      <p class="mt-4 text-pretty text-muted">
        That page doesn't exist. The pickers themselves are still where you left
        them.
      </p>

      <div class="mt-9 flex flex-col items-center gap-3 sm:flex-row">
        <a
          href="/"
          class="inline-flex w-full items-center justify-center rounded-lg border border-line bg-surface px-5 py-2.5 font-medium no-underline transition-colors hover:border-ow/60 sm:w-auto"
        >
          Back to Hero Pickers
        </a>
        <a
          href="https://www.owheropicker.com/"
          class="inline-flex w-full items-center justify-center rounded-lg bg-ow px-5 py-2.5 font-semibold text-ink no-underline transition-transform hover:brightness-110 active:scale-[0.98] sm:w-auto"
        >
          Overwatch
        </a>
        <a
          href="https://www.valorantpicker.com/"
          class="inline-flex w-full items-center justify-center rounded-lg bg-val px-5 py-2.5 font-semibold text-ink no-underline transition-transform hover:brightness-110 active:scale-[0.98] sm:w-auto"
        >
          Valorant
        </a>
      </div>
    </main>
  </body>
</html>
